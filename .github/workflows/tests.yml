name: Tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Installer les dépendances de test
        run: npm install --no-audit --no-fund
      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Vérifier la cohérence des données
        run: npm run verifier
      - name: Parcours complet (fiches et quiz)
        run: npm run test:parcours
